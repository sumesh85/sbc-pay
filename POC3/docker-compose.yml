services:
  keycloak:
    # JWT Authorization Grant per Keycloak release notes:
    #   26.5.0 — preview
    #   26.6.0 — GA (supported)
    # Using 26.6 for GA. No feature flag needed.
    image: quay.io/keycloak/keycloak:26.6
    container_name: poc3-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      # Deliberately NO token-exchange (Legacy V1). JWT Bearer Grant is GA in 26.6+.
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import

  partner-web:
    image: node:20-alpine
    container_name: poc3-partner-web
    working_dir: /app
    volumes:
      - ./partner-web:/app
    command: sh -c "npm install --silent && node server.js"
    ports:
      - "3000:3000"
    depends_on:
      - keycloak

  partner-backend:
    image: node:20-alpine
    container_name: poc3-partner-backend
    working_dir: /app
    volumes:
      - ./partner-backend:/app
    command: sh -c "npm install --silent && node server.js"
    environment:
      KC_INTERNAL: http://keycloak:8080
      KC_PUBLIC: http://localhost:8080
      PARTNER_REALM: partner
      BCROS_REALM: bcros
      PARTNER_CLIENT_ID: partner-webapp
      BCROS_CLIENT_ID: partner-service
      BCROS_CLIENT_SECRET: partner-service-secret
      BCROS_BACKEND_URL: http://bcros-backend:3003
    ports:
      - "3001:3001"
    depends_on:
      - keycloak

  bcros-web:
    image: node:20-alpine
    container_name: poc3-bcros-web
    working_dir: /app
    volumes:
      - ./bcros-web:/app
    command: sh -c "npm install --silent && node server.js"
    ports:
      - "3002:3002"

  bcros-backend:
    image: node:20-alpine
    container_name: poc3-bcros-backend
    working_dir: /app
    volumes:
      - ./bcros-backend:/app
    command: sh -c "npm install --silent && node server.js"
    environment:
      KC_INTERNAL: http://keycloak:8080
      BCROS_REALM: bcros
    ports:
      - "3003:3003"
    depends_on:
      - keycloak
